title: "Week 8"
subtitle: "Week 8 — Anxiety, Fear and the Amygdala"

papers:
  - title: "Prefrontal cortical function and anxiety: controlling attention to threat-related stimuli"
    authors: "Bishop et al. (2004)"
    journal: "Nature Neuroscience"
    doi: "10.1038/nn1173"
    openalex_id: "W2112011323"
    embed_url: "https://drive.google.com/file/d/1njYRj6yJeUndxV8QmJ09CfSlcbAJlURw/preview"
    podcast_url: "https://drive.google.com/file/d/1ml8BthYSWzV0E3B1YtiszLxi6sNedNoN/preview"
    podcast_transcript: |
      Okay, this paper by Bishop et al. in 2004 examines how the brain helps us stay focused when threatening information competes for our attention and how this process differs in people with higher levels of anxiety. Now to investigate this, the researchers scanned participants' brains using fMRI whilst they completed a visual task. Participants had to decide whether two houses matched whilst ignoring a pair of faces that were presented at the same time. The faces showed either neutral or fearful expressions, making the fearful faces the emotional distractors and the neutral faces non-emotional distractors. The researchers also manipulated how often fearful faces appeared, so in some blocks they were common and expected whilst in others they were rare and unexpected. This allowed the team to examine how the brain responded in both anticipated and unexpected threat-related distractor conditions.

      The study focused on two brain regions, the rostral anterior cingulate cortex or rostral ACC and the lateral prefrontal cortex. The results showed that the rostral ACC was particularly active when fearful faces appeared unexpectedly. Now the authors suggest that this region helps detect and manage the conflict created when emotionally important information captures attention. The lateral prefrontal cortex appeared to serve a different function. Activity in this region increased when the threatening distractors were expected, suggesting it helps prepare and maintain attentional control in advance.

      The researchers also found the participants with higher levels of anxiety showed reduced activity in both of these control systems. They had less rostral ACC activity overall and less recruitment of the lateral prefrontal cortex when that threat was anticipated.

      Now the authors conclude that these two brain regions play complementary roles in controlling attention in the presence of emotional distraction. The rostral ACC appears to respond when unexpected threats arise whilst the lateral prefrontal cortex helps prepare for and resist anticipated distractions. The finding suggests that anxiety may be associated with the reduced ability to engage these control mechanisms effectively.

      So overall, the paper provides evidence that the ability to stay focused in the face of emotional distraction depends on coordinated activity within prefrontal brain networks and that the system operates less efficiently in people experiencing higher levels of anxiety.
    glossary:
      - term: "Trait anxiety"
        definition: "A stable personality characteristic reflecting a general tendency to perceive situations as threatening and respond with anxiety."
      - term: "Attentional bias"
        definition: "The tendency to preferentially allocate attention toward certain stimuli, such as threatening faces in anxious individuals."
      - term: "Rostral anterior cingulate cortex"
        definition: "A frontal midline region involved in detecting emotional conflict and regulating emotional responses."
      - term: "Lateral prefrontal cortex"
        definition: "A region on the outer surface of the frontal lobe involved in cognitive control, working memory, and attentional regulation."
      - term: "Cognitive control"
        definition: "The ability to flexibly direct attention and behaviour according to goals, suppressing irrelevant or distracting information."
      - term: "Threat-related distractors"
        definition: "Stimuli with negative emotional content (e.g. angry faces) that capture attention away from an ongoing task."
      - term: "Top-down suppression"
        definition: "The prefrontal cortex actively inhibiting processing of irrelevant stimuli to maintain focus on the current task."
      - term: "Cognitive behavioural therapy"
        definition: "A psychological treatment that targets maladaptive thought patterns and behaviours, the first-line therapy for anxiety disorders."
    mcqs:
      - question: "Which prefrontal region did the authors associate with controlling attention to threat-related distractors?"
        options:
          - "Orbitofrontal cortex"
          - "Dorsolateral prefrontal cortex"
          - "Rostral anterior cingulate cortex and lateral PFC"
          - "Ventromedial prefrontal cortex"
        answer: 2
      - question: "How did higher trait anxiety affect prefrontal responses to threat distractors?"
        options:
          - "It increased prefrontal control"
          - "It had no effect"
          - "It reduced prefrontal recruitment, especially for frequent threats"
          - "It shifted processing to the cerebellum"
        answer: 2
    short_answers:
      - question: "How does this study bridge cognitive control theory with models of anxiety?"
        model_answer: "The study shows that the same prefrontal regions involved in cognitive control of non-emotional conflict (dorsal ACC, lateral PFC) also regulate attention to emotional distractors, but through partially dissociable subdivisions — rostral ACC responds to unexpected emotional conflict while dorsal ACC handles cognitive conflict. Crucially, anxiety reduces this prefrontal control, suggesting anxious individuals fail to recruit top-down mechanisms to suppress threat-related distractors, providing a neural basis for attentional biases in anxiety."

  - title: "The human amygdala and the induction and experience of fear"
    authors: "Feinstein et al. (2011)"
    journal: "Current Biology"
    doi: "10.1016/j.cub.2010.11.042"
    openalex_id: "W2026202566"
    embed_url: "https://drive.google.com/file/d/1mQ-g8JYVkUTtPjbI__SL4WvGytN1LhnN/preview"
    podcast_url: "https://drive.google.com/file/d/1WOVMUeTSSJyhGciqn0VsCz-Yupd2L0cO/preview"
    podcast_transcript: |
      Hi there, everyone. So the first paper this week is one about fear processing and the amygdala and it's by Feinstein and colleagues. Now the paper looks at a woman known as SM who has damaged her amygdala. The amygdala is often thought of being important for processing fear and you know at this point when the paper was published that's the same, it was thought to be important in the full processing of fear. But this study looked at whether it was necessary for the feeling of fear. So to investigate fear processing in the absence of the amygdala the researchers exposed SM to several situations that would normally make most people feel afraid. So they took her to a pet shop with snakes and spiders. They walked her through a haunted house and they showed her scary movie clips.

      Now what was quite remarkable about this was that she showed almost no fear at all in any of those situations. So in the pet shop instead of avoiding the snakes and spiders she wanted to touch them and was fascinated by them. In the haunted house while everyone else was quite scared and screaming she was happily leading the group through and even trying to talk to the actors that were dressed as monsters. And when she was watching horror films she found them entertaining rather than frightening.

      The researchers also looked beyond these tests and they used questionnaires and a three-month diary study to measure her everyday emotional experiences. And again the pattern was really similar. She reported experiencing lots of emotions including happiness, sadness, anger and disgust but virtually no fear. In fact one of the words that best described her everyday experience was fearless.

      What's I think even more striking is that SM had experienced genuinely dangerous events in her life, so she'd been threatened, assaulted and exposed to situations that most people would find traumatic. Yet when she was describing these experiences she reported feeling upset or angry but not afraid.

      So the main conclusion of the paper is that the amygdala appears to play a critical role in triggering the feeling of fear and without a functioning amygdala surrounding situations don't seem to generate the normal fear response. Importantly this doesn't mean someone loses all emotions. They found that SM could still experience many other feelings. So her impairment was surprisingly specific to fear.

      Now more broadly the study suggests that fear has an important evolutionary function. Fear helps us recognise danger and avoid risky situations and SM's case shows what can happen when that system's missing. People might become unusually curious about threats and fail to keep themselves safe. So in short, in summary, the paper provides some strong evidence to suggest that the human amygdala is essential for generating the experience of fear and for motivating us to avoid danger.
    glossary:
      - term: "Urbach-Wiethe disease"
        definition: "A rare genetic condition that can cause selective bilateral calcification and destruction of the amygdalae, leaving other brain structures intact."
      - term: "Bilateral amygdala lesion"
        definition: "Damage to the amygdala in both hemispheres, resulting in impaired fear processing while other emotions remain intact."
      - term: "Fear conditioning"
        definition: "A form of learning where a neutral stimulus becomes associated with a threat, eliciting a fear response on subsequent encounters."
      - term: "Autonomic fear response"
        definition: "The body's automatic physiological reaction to threat — increased heart rate, sweating, pupil dilation — driven by the sympathetic nervous system."
      - term: "Calcification"
        definition: "Abnormal accumulation of calcium deposits in tissue, in this case destroying amygdala neurons while preserving surrounding structures."
      - term: "Avoidance behaviour"
        definition: "Actions taken to prevent or escape contact with a feared stimulus, a hallmark behavioural component of fear."
      - term: "Double dissociation"
        definition: "Evidence that two cognitive functions are independent: one can be impaired while the other is spared, and vice versa."
      - term: "Affective neuroscience"
        definition: "The study of the neural mechanisms underlying emotions, moods, and feelings."
    mcqs:
      - question: "What was unique about patient SM that made her valuable for this study?"
        options:
          - "She had damage to her prefrontal cortex"
          - "She had focal bilateral amygdala lesions"
          - "She had congenital blindness"
          - "She had damage to her hippocampus"
        answer: 1
      - question: "How did SM respond when exposed to live snakes, spiders, and a haunted house?"
        options:
          - "She showed intense fear and avoidance"
          - "She showed fear only to snakes"
          - "She exhibited no fear and no avoidance behaviour"
          - "She showed delayed fear responses"
        answer: 2
    short_answers:
      - question: "What do SM's preserved abilities (other emotions, normal cognition) tell us about the specificity of amygdala function?"
        model_answer: "SM's ability to experience other basic emotions (happiness, sadness, disgust) and maintain normal cognition despite absent fear demonstrates that the amygdala has a specific and pivotal role in fear rather than being a general-purpose emotion centre. The amygdala appears necessary for triggering the action programme of fear, and without this trigger, the subjective experience of fear is precluded — suggesting fear induction and fear experience are tightly coupled through amygdala function."
